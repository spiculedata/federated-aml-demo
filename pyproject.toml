[build-system]
requires = ["setuptools>=68", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedxgb-demo"
version = "0.1.0"
description = "Federated transaction monitoring with Polars streaming and XGBoost"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "rich>=15.0.0",
    "xgboost>=3.4.1",
]

[tool.setuptools]
packages = ["fedxgb"]

[dependency-groups]
dev = [
    "cython>=3.3.0",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "setuptools>=84.0.0",
]
